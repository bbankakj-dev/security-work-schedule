<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Work Schedule - Continental Tyres</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <!-- Google Fonts Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [v-cloak] { display: none; }
    /* กันหน้าเว็บกว้างเกินจอมือถือ: เนื้อหาที่ล้นถูกตัดแทนการทำให้ทั้งหน้าเลื่อนข้าง (ตารางยังเลื่อนข้างในกรอบของตัวเองได้) */
    #app { max-width: 100vw; overflow-x: clip; }
    select, input { max-width: 100%; }
    body { font-family: 'Prompt', sans-serif; }
    .table-container { max-height: 75vh; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Sticky columns: freeze only No. + Name (≈164px) so the date columns (23 ... 22) stay scrollable on phones */
    .sticky-col-1 { position: sticky; left: 0; z-index: 20; width: 36px; min-width: 36px; max-width: 36px; }
    .sticky-col-4 { position: sticky; left: 36px; z-index: 20; width: 128px; min-width: 128px; max-width: 128px;
                    white-space: normal; line-height: 1.25; box-shadow: 3px 0 6px -1px rgba(0, 0, 0, 0.12); }
    th.sticky-col-1, th.sticky-col-4 { z-index: 35 !important; }

    /* Scrolling table: swipe sideways inside the table, vertical scroll of the page still works */
    .table-container { overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
    .schedule-table { width: max-content; min-width: 100%; }

    @page schedulepage { size: A4 landscape; margin: 8mm; }
    @page signpage { size: A4 portrait; margin: 8mm; }

    @media print {
      body * { visibility: hidden; }
      #printableBillingArea, #printableBillingArea * { visibility: visible; }
      #printableBillingArea { position: absolute; left: 0; top: 0; width: 100%; }
      #printableScheduleArea, #printableScheduleArea * { visibility: visible; }
      #printableScheduleArea { position: absolute; left: 0; top: 0; width: 100%; page: schedulepage;
                               -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #printableScheduleArea .overflow-x-auto { overflow: visible !important; }
      #printableScheduleArea table { font-size: 8px; }
      #printableScheduleArea { border: none !important; box-shadow: none !important; padding: 0 !important; }
      #printableSignArea, #printableSignArea * { visibility: visible; }
      #printableSignArea { position: absolute; left: 0; top: 0; width: 100%; page: signpage;
                           -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #printableSignArea .sign-page { break-after: page; border: none !important; box-shadow: none !important;
                                      padding: 0 !important; border-radius: 0 !important; }
      #printableSignArea .sign-page:last-child { break-after: auto; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="app" v-cloak class="flex flex-col min-h-screen">

    <!-- ===== หน้าใส่รหัส PIN ก่อนเข้าดูตาราง ===== -->
    <div v-if="!pinUnlocked" class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
      <div class="w-full max-w-xs bg-white rounded-2xl shadow-2xl p-6 text-center space-y-4">
        <div class="w-14 h-14 mx-auto rounded-xl bg-amber-500 flex items-center justify-center text-2xl font-bold text-slate-950 shadow">CT</div>
        <div>
          <h1 class="text-base font-bold text-slate-900">Security Work Schedule</h1>
          <p class="text-xs text-slate-500 mt-0.5">กรุณาใส่รหัส PIN เพื่อเข้าดูตารางเวร</p>
        </div>
        <input type="password" inputmode="numeric" autocomplete="off" maxlength="8" autofocus
               v-model="pinInput" @keyup.enter="submitPin" placeholder="••••"
               class="w-full text-center tracking-[0.5em] text-2xl font-bold border-2 border-slate-300 rounded-xl py-2.5 focus:outline-none focus:border-amber-500">
        <p v-if="pinError" class="text-xs text-red-600 font-semibold">{{ pinError }}</p>
        <label class="flex items-center justify-center gap-2 text-xs text-slate-600">
          <input type="checkbox" v-model="pinRemember"> จำเครื่องนี้ไว้ (30 วัน)
        </label>
        <button @click="submitPin" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition">
          เข้าสู่หน้าตาราง
        </button>
      </div>
    </div>

    <template v-if="pinUnlocked">
    
    <!-- Top Header -->
    <header class="bg-slate-900 text-white shadow-md md:sticky md:top-0 z-50 border-b border-amber-500 no-print">
      <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
        <!-- Logo & Title -->
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-lg bg-amber-500 flex items-center justify-center font-bold text-slate-950 text-lg shadow">
            CT
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
              Security Work Schedule
              <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">GDDL 5/2</span>
            </h1>
            <p class="text-[11px] text-slate-400">ระบบบริหารตารางเวร รปภ. โรงงาน Continental Tyres</p>
          </div>
        </div>

        <!-- Role & Auth Status -->
        <div class="flex flex-wrap items-center gap-2 max-w-full min-w-0">
          <!-- สถานะการเชื่อมต่อระบบกลาง -->
          <span class="text-[10px] px-2 py-1 rounded-full border"
                :class="{
                  'bg-emerald-950 border-emerald-500/40 text-emerald-300': cloudStatus === 'online',
                  'bg-slate-800 border-slate-600 text-slate-300': cloudStatus === 'connecting' || cloudStatus === 'local',
                  'bg-red-950 border-red-500/40 text-red-300': cloudStatus === 'error'
                }"
                :title="cloudStatus === 'local' ? 'ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่แชร์ข้ามเครื่อง' : ''">
            {{ cloudStatus === 'online' ? '☁️ ออนไลน์ (ข้อมูลกลาง)' : cloudStatus === 'connecting' ? '☁️ กำลังเชื่อมต่อ...' : cloudStatus === 'error' ? '⚠️ เชื่อมต่อระบบกลางไม่ได้' : '💾 เครื่องนี้เท่านั้น' }}
          </span>

          <button @click="lockApp" class="text-[10px] px-2 py-1 rounded-full border border-slate-600 bg-slate-800 text-slate-300 hover:text-white" title="ล็อกหน้าจอ (ต้องใส่ PIN ใหม่)">🔒 ล็อก</button>

          <!-- Logged in as Admin -->
          <div v-if="isAdmin" class="flex flex-wrap items-center gap-x-2 gap-y-1 max-w-full rounded-2xl sm:rounded-full bg-emerald-950 border border-emerald-500/40 text-emerald-300 text-xs px-3 py-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            สิทธิ์: Admin (Site Manager: {{ currentUser.name }})
            <button @click="openChangePasswordModal" class="ml-1 text-amber-300 hover:text-white underline" title="เปลี่ยนรหัสผ่าน">🔑 เปลี่ยนรหัสผ่าน</button>
            <button @click="logout" class="ml-1 text-slate-400 hover:text-white underline">ออกจากระบบ</button>
          </div>

          <!-- Logged in as Supervisor -->
          <div v-else-if="isSupervisor" class="flex flex-wrap items-center gap-x-2 gap-y-1 max-w-full rounded-2xl sm:rounded-full bg-indigo-950 border border-indigo-500/40 text-indigo-300 text-xs px-3 py-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
            สิทธิ์: Supervisor ({{ currentUser.name }})
            <button @click="openChangePasswordModal" class="ml-1 text-amber-300 hover:text-white underline" title="เปลี่ยนรหัสผ่าน">🔑 เปลี่ยนรหัสผ่าน</button>
            <button @click="logout" class="ml-1 text-slate-400 hover:text-white underline">ออกจากระบบ</button>
          </div>

          <!-- กำลังตรวจสอบการเข้าสู่ระบบเดิม -->
          <div v-else-if="!authReady" class="text-xs text-slate-400 px-3 py-1.5">กำลังตรวจสอบสิทธิ์...</div>

          <!-- General Guard Viewer (Not logged in) -->
          <div v-else class="flex flex-wrap items-center gap-x-2 gap-y-1 max-w-full bg-slate-800 border border-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-2xl sm:rounded-full">
            <span class="w-2 h-2 rounded-full bg-slate-400"></span>
            โหมด: รปภ. ทั่วไป (ดูตารางอย่างเดียว)
            <div class="flex gap-1.5 sm:ml-2">
              <button @click="showLoginModal = true" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-0.5 rounded font-bold transition">
                เข้าสู่ระบบ
              </button>
              <button @click="showRegisterModal = true" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-0.5 rounded font-medium transition">
                ลงทะเบียน Sup
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Navigation Bar -->
    <div class="bg-white border-b border-slate-200 shadow-sm md:sticky md:top-[57px] z-40 no-print">
      <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6 flex flex-wrap items-center justify-between gap-2 py-1.5">
        
        <!-- Navigation Tabs (Separated as requested) -->
        <nav class="flex space-x-1 overflow-x-auto text-xs font-medium min-w-0 max-w-full w-full lg:w-auto">
          <button @click="selectTab('schedule')" 
                  :class="currentTab === 'schedule' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            📅 ตารางเวรรวม
          </button>
          <button @click="selectTab('spare_summary')" 
                  :class="currentTab === 'spare_summary' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            📊 สรุปการขอสแปร์
          </button>
          <button @click="selectTab('leave_replace')" 
                  :class="currentTab === 'leave_replace' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            📝 คนแจ้งลา
            <span v-if="leaveRecords.length > 0" class="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">
              {{ leaveRecords.length }}
            </span>
          </button>
          <button @click="selectTab('spare_arrivals')" 
                  :class="currentTab === 'spare_arrivals' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            🧑‍🔧 สแปร์ที่มาปฏิบัติงาน
            <span v-if="spareArrivals.length > 0" class="bg-purple-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">
              {{ spareArrivals.length }}
            </span>
          </button>
          <button @click="selectTab('personal')" 
                  :class="currentTab === 'personal' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            👤 สรุปรายบุคคล (รปภ.)
          </button>
          <button @click="selectTab('permanent_roster')" 
                  :class="currentTab === 'permanent_roster' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            👥 จัดการ รปภ.ประจำ
          </button>
          <button @click="selectTab('schedule_print')" 
                  :class="currentTab === 'schedule_print' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            📄 สรุปตารางเวรและสแปร์
            <span v-if="!isAdmin" class="text-[9px] bg-slate-200 text-slate-600 px-1 py-0.2 rounded">เฉพาะ Admin</span>
          </button>
          <button @click="selectTab('sign_sheet')" 
                  :class="currentTab === 'sign_sheet' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            ✍️ ใบลงชื่อเข้าปฏิบัติหน้าที่
            <span v-if="!isSupervisor" class="text-[9px] bg-slate-200 text-slate-600 px-1 py-0.2 rounded">เฉพาะ Sup/Admin</span>
          </button>
          <button @click="selectTab('billing')" 
                  :class="currentTab === 'billing' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            🖨️ สรุปชั่วโมงการปฏิบัติงาน
            <span v-if="!isAdmin" class="text-[9px] bg-slate-200 text-slate-600 px-1 py-0.2 rounded">เฉพาะ Admin</span>
          </button>
          <button v-if="isAdmin" @click="selectTab('admin_settings')" 
                  :class="currentTab === 'admin_settings' ? 'bg-amber-500 text-slate-950 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
                  class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shrink-0">
            ⚙️ ตั้งค่า & วันหยุด
          </button>
        </nav>

        <!-- Cycle Selector -->
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1 max-w-full min-w-0 bg-slate-50 border border-slate-300 px-2.5 py-1 rounded-lg text-xs">
          <span class="text-slate-500 font-medium">รอบ:</span>
          <select v-model="selectedCycleIndex" class="bg-transparent font-semibold text-slate-800 focus:outline-none cursor-pointer min-w-0 max-w-full">
            <option v-for="(cycle, idx) in payrollCycles" :key="idx" :value="idx">
              {{ cycle.name }} (23 {{ cycle.startMonth }} - 22 {{ cycle.endMonth }})
            </option>
          </select>
          <span class="text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded font-medium text-[11px]">
            💵 ออก: 1 {{ currentCycle.payDateMonth }}
          </span>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6 py-3 flex-1 w-full">

      <!-- ===================================================================== -->
      <!-- TAB 1: ตารางเวรรวม 39 คน (Master Schedule with Sticky Left & Header)  -->
      <!-- ===================================================================== -->
      <section v-if="currentTab === 'schedule'" class="space-y-2.5">
        
        <!-- Work Hours & Shift Legend Banner -->
        <div class="bg-white py-2 px-3.5 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
          <div>
            <div class="font-bold text-slate-800 flex items-center gap-2">
              <span>ตารางเวรรวมรอบ {{ currentCycle.name }}</span>
              <span class="text-[11px] font-normal text-slate-500">(23 ถึง 22 ของเดือนถัดไป)</span>
            </div>
            <!-- Work Hours Details (Per Item 6) -->
            <div class="flex flex-wrap items-center gap-2.5 mt-1 text-[11px] text-slate-600">
              <span class="bg-amber-50 text-amber-900 border border-amber-200 px-1.5 py-0.5 rounded font-medium">
                🕒 Site M / Fireman: <b>08:00 - 20:00</b>
              </span>
              <span class="bg-blue-50 text-blue-900 border border-blue-200 px-1.5 py-0.5 rounded font-medium">
                🕒 Reception: <b>07:00 - 17:00</b>
              </span>
              <span class="bg-slate-50 text-slate-700 border border-slate-200 px-1.5 py-0.5 rounded font-medium">
                ☀️ กะ Day อื่นๆ: <b>06:30 - 18:30</b>
              </span>
              <span class="bg-indigo-50 text-indigo-900 border border-indigo-200 px-1.5 py-0.5 rounded font-medium">
                🌙 กะ Night อื่นๆ: <b>18:30 - 06:30</b>
              </span>
            </div>
          </div>

          <!-- Admin & Sup Actions -->
          <div v-if="isAdmin || isSupervisor" class="flex items-center gap-2">
            <button @click="openLeaveModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm flex items-center gap-1 transition">
              📝 แจ้งคนลา (ขอสแปร์)
            </button>
            <button @click="openSpareModal()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm flex items-center gap-1 transition">
              🧑‍🔧 บันทึกสแปร์ที่มา
            </button>
            <button v-if="isAdmin" @click="resetScheduleToMaster" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg text-xs transition">
              🔄 รีเซ็ต Master
            </button>
          </div>
        </div>

        <!-- Interactive Schedule Table with Freeze Header & Left Columns -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto table-container relative">
            <table class="schedule-table text-xs text-left border-collapse">
              
              <!-- Sticky Top Header -->
              <thead class="sticky top-0 bg-slate-900 text-white z-30">
                <tr>
                  <!-- Sticky Left 4 Columns -->
                  <th class="py-1.5 px-2 font-semibold text-center border-b border-slate-700 bg-slate-900 sticky-col-1">No.</th>
                  <th class="py-1.5 px-2 font-semibold border-b border-slate-700 min-w-[130px] bg-slate-900">ตำแหน่ง (Position)</th>
                  <th class="py-1.5 px-2 font-semibold border-b border-slate-700 min-w-[90px] bg-slate-900">รหัส Code</th>
                  <th class="py-1.5 px-2 font-semibold border-b border-slate-700 bg-slate-900 sticky-col-4">ชื่อ - นามสกุล</th>
                  
                  <!-- Dynamic Day Columns (23rd to 22nd) -->
                  <th v-for="(day, dIdx) in currentCycleDays" :key="dIdx" 
                      @click="toggleSelectDate(day.dateString)"
                      class="py-1 px-1 font-semibold text-center border-b border-slate-700 min-w-[34px] cursor-pointer transition select-none"
                      :class="[
                        selectedDateStr === day.dateString
                          ? '!bg-amber-400 !text-slate-950 font-black ring-2 ring-amber-300'
                          : (isWeekend(day.date) ? 'bg-slate-800 text-amber-300 hover:bg-slate-700' : 'bg-slate-900 text-slate-200 hover:bg-slate-800'),
                        day.isHoliday && selectedDateStr !== day.dateString ? 'bg-purple-900 text-purple-200' : ''
                      ]"
                      :title="(day.isHoliday ? day.holidayName + ' · ' : '') + 'คลิกเพื่อเน้น/ไฮไลต์ทั้งคอลัมน์ของวันนี้'">
                    <div class="flex items-center justify-center gap-0.5">
                      <span>{{ day.dayNumber }}</span>
                      <span v-if="day.isHoliday" class="text-[8px] bg-purple-500 text-white px-0.5 rounded">PH</span>
                    </div>
                    <div class="text-[9px] font-normal" :class="selectedDateStr === day.dateString ? 'text-slate-950 font-bold' : (isWeekend(day.date) ? 'text-amber-400' : 'text-slate-400')">
                      {{ day.dayName }}
                    </div>
                  </th>
                  
                  <!-- Summary Column Headers -->
                  <th class="py-1.5 px-1.5 font-semibold text-center bg-slate-800 border-b border-slate-700">D</th>
                  <th class="py-1.5 px-1.5 font-semibold text-center bg-slate-800 border-b border-slate-700">N</th>
                  <th class="py-1.5 px-1.5 font-semibold text-center bg-slate-800 border-b border-slate-700">รวมวัน</th>
                  <th class="py-1.5 px-1.5 font-semibold text-center bg-slate-800 border-b border-slate-700">หยุด</th>
                  <th class="py-1.5 px-1.5 font-semibold text-center bg-slate-800 border-b border-slate-700">Audit</th>
                </tr>
              </thead>

              <!-- Table Body -->
              <tbody class="divide-y divide-slate-100">
                <tr v-for="(guard, gIdx) in scheduleData" :key="guard.id" 
                    @click="toggleSelectGuard(guard.id)"
                    class="transition group cursor-pointer"
                    :class="[
                      selectedGuardId === guard.id 
                        ? '!bg-amber-100 font-medium ring-2 ring-inset ring-amber-500' 
                        : (guard.isSpare ? 'bg-slate-50/70 hover:bg-amber-50/70' : 'hover:bg-amber-50/70')
                    ]">
                  
                  <!-- Sticky Column 1: No. -->
                  <td class="py-1 px-2 text-center text-slate-500 font-medium sticky-col-1 transition"

        <div v-if="regularSpares.length" class="mb-3 bg-amber-50 border border-amber-200 rounded-xl p-2.5">
          <p class="text-[10px] font-bold text-amber-800 mb-1.5">⭐ สแปร์ประจำ — กดเลือกเพื่อกรอกอัตโนมัติ</p>
          <div class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto">
            <button v-for="(sp, i) in regularSpares" :key="i"
                    @click="pickRegularSpare(sp)"
                    class="text-[11px] bg-white border border-amber-300 hover:bg-amber-100 text-amber-900 font-semibold px-2 py-1 rounded-lg transition">
              {{ sp.name }}<span v-if="sp.code" class="text-amber-500 font-normal ml-1">({{ sp.code }})</span>
            </button>
          </div>
        </div>
        <div v-else class="mb-3 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-[10px] text-slate-400">
          ยังไม่มีสแปร์ประจำบันทึกไว้ (Admin สามารถเพิ่มได้ด้านล่าง)
        </div>

        <!-- Admin: จัดการสแปร์ประจำ -->
        <div v-if="isAdmin" class="mb-3">
          <button @click="showRegularSpareMgr = !showRegularSpareMgr"
                  class="text-[11px] text-amber-700 underline hover:text-amber-900">
            {{ showRegularSpareMgr ? '▲ ซ่อนการจัดการสแปร์ประจำ' : '▼ จัดการรายชื่อสแปร์ประจำ (เพิ่ม/ลบ)' }}
          </button>
          <div v-if="showRegularSpareMgr" class="mt-2 p-2.5 border border-amber-200 bg-amber-50/60 rounded-xl space-y-2">
            <div class="flex gap-1.5 items-end">
              <div class="flex-1">
                <label class="text-[10px] text-slate-600 block">รหัส (ถ้ามี):</label>
                <input v-model="regularSpareForm.code" placeholder="เช่น SP01" class="w-full bg-white border rounded p-1 text-xs font-mono">
              </div>
              <div class="flex-[2]">
                <label class="text-[10px] text-slate-600 block">ชื่อ - สกุล: <span class="text-red-500">*</span></label>
                <input v-model="regularSpareForm.name" placeholder="ชื่อ สกุล" class="w-full bg-white border rounded p-1 text-xs font-bold">
              </div>
              <button @click="addRegularSpare"
                      class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-2.5 py-1 rounded-lg text-xs whitespace-nowrap">
                + เพิ่ม
              </button>
            </div>
            <div v-if="regularSpares.length" class="space-y-1 max-h-24 overflow-y-auto">
              <div v-for="(sp, i) in regularSpares" :key="i"
                   class="flex items-center justify-between bg-white border border-amber-200 rounded px-2 py-0.5 text-xs">
                <span class="font-semibold">{{ sp.name }}<span v-if="sp.code" class="text-slate-400 font-normal ml-1">({{ sp.code }})</span></span>
                <button @click="removeRegularSpare(i)" class="text-red-500 hover:text-red-700 ml-2 font-bold">✕</button>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-3 text-xs mb-4">
          <div class="bg-purple-50/60 p-2.5 rounded-lg border border-purple-200 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-600 block">วันที่:</label>
                <input type="date" v-model="spareForm.date" class="w-full bg-white border rounded p-1 font-semibold">
              </div>
              <div>
                <label class="text-[10px] text-slate-600 block">กะ:</label>
                <div class="grid grid-cols-2 gap-1">
                  <button type="button" @click="spareForm.shift = 'D'"
                          :class="spareForm.shift === 'D' ? 'bg-amber-500 text-slate-950 font-bold border-amber-600' : 'bg-white border text-slate-700'"
                          class="py-1 border rounded">☀️ เช้า</button>
                  <button type="button" @click="spareForm.shift = 'N'"
                          :class="spareForm.shift === 'N' ? 'bg-indigo-600 text-white font-bold border-indigo-700' : 'bg-white border text-slate-700'"
                          class="py-1 border rounded">🌙 ดึก</button>
                </div>
              </div>
            </div>
            <div>
              <label class="text-[10px] text-slate-600 block">เข้าแทนจุดไหน: <span class="text-red-500">*</span></label>
              <select v-model="spareForm.positionNo" class="w-full bg-white border rounded p-1 font-semibold">
                <option value="">— เลือกจุดที่เข้าแทน —</option>
                <optgroup v-if="spareSpotOptions.needed.length" :label="'จุดที่ยังต้องการสแปร์ (' + spareSpotOptions.needed.length + ')'">
                  <option v-for="o in spareSpotOptions.needed" :key="'n' + o.no" :value="o.no">{{ o.text }}</option>
                </optgroup>
                <optgroup label="ตำแหน่งอื่นๆ">
                  <option v-for="o in spareSpotOptions.others" :key="'o' + o.no" :value="o.no">{{ o.text }}</option>
                </optgroup>
              </select>
              <p v-if="!spareSpotOptions.needed.length" class="text-[10px] text-slate-400 mt-0.5">วัน/กะนี้ไม่มีจุดที่ค้างขอสแปร์ (หรือมีสแปร์ครบแล้ว) เลือกจากตำแหน่งอื่นได้</p>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-600 block">รหัส (ถ้ามี):</label>
                <input type="text" v-model="spareForm.code" placeholder="เช่น SP01" class="w-full bg-white border rounded p-1 font-mono font-bold">
              </div>
              <div>
                <label class="text-[10px] text-slate-600 block">ชื่อ - สกุล สแปร์:</label>
                <input type="text" v-model="spareForm.name" placeholder="ชื่อ สกุล" class="w-full bg-white border rounded p-1 font-bold">
              </div>
            </div>
            <div>
              <label class="text-[10px] text-slate-600 block">หมายเหตุ (ถ้ามี):</label>
              <input type="text" v-model="spareForm.note" class="w-full bg-white border rounded p-1">
            </div>
          </div>
        </div>

        <div class="flex gap-2">
          <button @click="showSpareModal = false" class="w-1/2 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            ยกเลิก
          </button>
          <button @click="submitSpare" class="w-1/2 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition">
            บันทึกสแปร์
          </button>
        </div>
      </div>
    </div>

    </template>
  </div>

  <!-- Firebase SDK (compat, ปักเวอร์ชัน) + ค่า config ของโปรเจกต์ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
